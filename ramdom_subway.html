<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>지하철 랜덤 뽑기</title>

  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    select,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border-radius: 10px;
    }

    button {
      border: none;
      background-color: #007aff;
      color: white;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.97);
    }

    #result {
      margin-top: 30px;
      font-size: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚇 지하철 랜덤 뽑기</h1>

    <p>호선을 선택하세요.</p>

    <select id="line">
      <option value="1">1호선</option>
      <option value="2">2호선</option>
      <option value="3">3호선</option>
      <option value="4">4호선</option>
      <option value="5">5호선</option>
      <option value="6">6호선</option>
      <option value="7">7호선</option>
      <option value="8">8호선</option>
      <option value="9">9호선</option>
    </select>

    <button onclick="drawNumber()">랜덤 숫자 뽑기</button>

    <div id="result">결과가 여기에 나옵니다.</div>
  </div>

  <script>
    // 과제에서 정한 역 개수에 맞게 수정
    const stationCounts = {
      1: 10,
      2: 51,
      3: 44,
      4: 51,
      5: 56,
      6: 39,
      7: 53,
      8: 18,
      9: 38
    };

    function drawNumber() {
      const line = document.getElementById("line").value;
      const count = stationCounts[line];

      // 1부터 해당 호선의 역 개수까지
      const randomNumber =
        Math.floor(Math.random() * count) + 1;

      document.getElementById("result").innerHTML =
        `${line}호선은 총 ${count}개 역<br>` +
        `🎉 뽑힌 숫자: ${randomNumber}번`;
    }
  </script>
</body>
</html>
